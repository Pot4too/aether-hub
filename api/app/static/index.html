<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aether Hub</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Aether Hub</h1>
    <div class="refresh-controls">
      <label for="refresh-interval">Refresh</label>
      <select id="refresh-interval">
        <option value="10">10s</option>
        <option value="30">30s</option>
        <option value="60" selected>60s</option>
        <option value="300">5m</option>
        <option value="0">Off</option>
      </select>
      <label for="refresh-custom">Custom (s)</label>
      <input type="number" id="refresh-custom" min="1" placeholder="e.g. 15" />
    </div>
  </header>

  <div id="status-banner" class="status" hidden></div>

  <main class="layout">
    <aside class="sidebar">
      <h2>Nodes</h2>
      <ul id="node-list"></ul>
    </aside>

    <section class="content">
      <h2 id="selected-node-title">Select a node</h2>
      <div id="readings-wrap">
        <table id="readings-table">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="charts"></div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
